pipeline:
  name: new-ci-19
  identifier: newci19
  projectIdentifier: LBGHarnessTraining
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: Githubconndemo
        build: <+input>
  stages:
    - stage:
        name: build
        identifier: build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: K8sconnector
              namespace: default
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    connectorRef: account.Docker_Connector
                    image: maven:3.9-eclipse-temurin-17
                    shell: Bash
                    command: |-
                      cd SmallestSpringApp  
                      mvn -B clean package
                      mvn -B test
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build_Push_Docker
                  identifier: Build_Push_Docker
                  spec:
                    connectorRef: Dockerhubconnector
                    repo: smm42947/spring-boot-artifacts
                    tags:
                      - v1.0.1
                    dockerfile: Dockerfile
                    context: SmallestSpringApp
